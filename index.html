<!doctype html>
<html lang="ko">
<head>
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem('theme');
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="배운 것과 만든 것을 기록하는 블로그">
  <title>내 블로그</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="list">
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="site-title" href="./">내 블로그</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false" title="다크 모드 전환">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="container">
    <div id="content">
      <h1 class="page-title">글 목록</h1>
      <p class="status">글을 불러오는 중…</p>
    </div>

    <section class="app-section" aria-labelledby="apps-title">
      <h2 class="page-title" id="apps-title">웹앱</h2>
      <ul class="app-list">
        <li>
          <article class="app-card">
            <img src="apps/game-2048/preview.svg" alt="2048 게임 화면 미리보기" width="400" height="400" loading="lazy">
            <div>
              <h3 class="app-card-title"><a href="apps/game-2048/">2048</a></h3>
              <p class="app-card-description">같은 숫자를 밀어 합쳐 2048을 만드는 퍼즐. 방향키나 스와이프로 플레이.</p>
            </div>
          </article>
        </li>
        <li>
          <article class="app-card">
            <img src="apps/pixel-art/preview.svg" alt="픽셀 아트 에디터 미리보기: 16×16 격자에 그린 빨간 하트" width="400" height="400" loading="lazy">
            <div>
              <h3 class="app-card-title"><a href="apps/pixel-art/">픽셀 아트</a></h3>
              <p class="app-card-description">16×16 격자에 도트를 찍어 그리고 PNG로 저장하는 픽셀 아트 에디터.</p>
            </div>
          </article>
        </li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 내 블로그</p>
    </div>
  </footer>
</body>
</html>
