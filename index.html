<!doctype html>
<html lang="ko">
<head>
  <script>
    (function () {
      var theme;
      try {
        theme = localStorage.getItem('theme');
      } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="배운 것과 만든 것을 기록하는 블로그">
  <title>내 블로그</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="list">
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="site-title" href="./">내 블로그</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false" title="다크 모드 전환">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="container" id="content">
    <h1 class="page-title">글 목록</h1>
    <p class="status">글을 불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 내 블로그</p>
    </div>
  </footer>
</body>
</html>
