<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <script>
    // 화면이 그려지기 전에 테마를 적용해 깜빡임을 막는다.
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body data-page="list">
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드" aria-pressed="false">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M1.5 12H4M20 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
      </button>
    </div>
  </header>

  <main class="container site-main">
    <h1 class="sr-only">My Blog</h1>

    <section class="home-section" aria-labelledby="apps-title">
      <h2 class="section-title" id="apps-title">웹앱</h2>
      <ul class="app-list">
        <li>
          <a class="app-card" href="apps/game-2048/index.html">
            <img class="app-card-preview" src="apps/game-2048/preview.svg" alt="2048 게임 화면 미리보기" width="96" height="96">
            <div class="app-card-body">
              <h3 class="app-card-title">2048</h3>
              <p class="app-card-description">같은 숫자를 밀어 합쳐 2048을 만드는 퍼즐. 방향키나 스와이프로 플레이.</p>
            </div>
          </a>
        </li>
      </ul>
    </section>

    <section class="home-section" aria-labelledby="posts-title">
      <h2 class="section-title" id="posts-title">글 목록</h2>
      <div id="post-list">
        <p class="status-message">불러오는 중…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 My Blog</p>
    </div>
  </footer>
</body>
</html>
