<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // 깜빡임(FOUC) 방지: 저장된 선택 → 시스템 설정 순서로 테마를 정한다.
    (() => {
      let theme = null;
      try {
        theme = localStorage.getItem('theme');
      } catch (error) {
        theme = null;
      }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <meta name="description" content="My Blog의 글 목록">
  <title>My Blog</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
  <script src="js/main.js" defer></script>
  <script type="module" src="js/posts.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">🌙</button>
      <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="메뉴 열기">☰</button>
      <nav class="nav" id="site-nav" aria-label="주 메뉴">
        <ul class="nav__list">
          <li><a class="nav__link nav__link--active" href="index.html" aria-current="page">글 목록</a></li>
          <li><a class="nav__link" href="about.html">소개</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <h1 class="page-title">글 목록</h1>
      <div class="post-list-area" aria-live="polite">
        <p class="page-text">글을 불러오는 중입니다…</p>
      </div>

      <section class="app-section" aria-labelledby="apps-title">
        <h2 class="app-section__title" id="apps-title">웹앱</h2>
        <ul class="app-list">
          <li>
            <article class="app-card">
              <img class="app-card__image" src="apps/game-2048/preview.svg" alt="2048 게임 화면 미리보기: 숫자 타일이 놓인 4×4 게임판" width="400" height="400" loading="lazy">
              <div class="app-card__body">
                <h3 class="app-card__title"><a class="app-card__link" href="apps/game-2048/">2048</a></h3>
                <p class="app-card__desc">같은 숫자를 밀어 합쳐 2048을 만드는 퍼즐 게임. 방향키·스와이프로 하고, 기록판에 점수가 남아요.</p>
              </div>
            </article>
          </li>
          <li>
            <article class="app-card">
              <img class="app-card__image" src="apps/pomodoro/preview.svg" alt="빨간 진행 링 안에 25:00이 표시된 뽀모도로 타이머 화면" width="640" height="360" loading="lazy">
              <div class="app-card__body">
                <h3 class="app-card__title"><a class="app-card__link" href="apps/pomodoro/">뽀모도로 타이머</a></h3>
                <p class="app-card__desc">25분 집중과 5분 휴식을 번갈아 재고, 오늘 완료한 집중 횟수를 기록합니다.</p>
              </div>
            </article>
          </li>
        </ul>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 My Blog</p>
    </div>
  </footer>
</body>
</html>
