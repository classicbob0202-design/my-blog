<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <script>
    // 화면이 그려지기 전에 테마를 적용해 깜빡임을 막는다.
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048 — My Blog</title>
  <meta name="description" content="같은 숫자를 밀어 합쳐 2048을 만드는 퍼즐. 방향키나 스와이프로 플레이.">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div class="game-wrap">
    <header class="game-header">
      <a class="back-link" href="../../index.html">← 블로그로</a>
      <div class="header-row">
        <h1 class="game-title">2048</h1>
        <div class="scores">
          <div class="score-box">
            <span class="score-label" id="score-label">점수</span>
            <output class="score-value" id="score" aria-labelledby="score-label" aria-live="off">0</output>
            <span class="score-plus" id="score-plus" aria-hidden="true"></span>
          </div>
          <div class="score-box">
            <span class="score-label" id="best-label">최고</span>
            <output class="score-value" id="best" aria-labelledby="best-label" aria-live="off">0</output>
          </div>
        </div>
      </div>
      <div class="header-row">
        <p class="game-intro">같은 숫자를 합쳐 2048을 만드세요!</p>
        <button class="button" type="button" id="new-game">새 게임</button>
      </div>
    </header>

    <main class="game-main">
      <div class="board" id="board" role="group" aria-label="2048 게임판" aria-describedby="game-help" tabindex="-1">
        <div class="cell-grid" aria-hidden="true">
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
          <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
        </div>
        <div class="tile-layer" id="tile-layer" aria-hidden="true"></div>

        <div class="overlay" id="win-overlay" role="dialog" aria-modal="true" aria-labelledby="win-title" hidden>
          <h2 class="overlay-title" id="win-title">2048 달성!</h2>
          <div class="overlay-actions">
            <button class="button" type="button" id="continue-button">계속하기</button>
            <button class="button button-secondary" type="button" id="win-new-game">새 게임</button>
          </div>
        </div>

        <div class="overlay" id="over-overlay" role="dialog" aria-modal="true" aria-labelledby="over-title" hidden>
          <h2 class="overlay-title" id="over-title">더 이상 움직일 수 없어요</h2>
          <p class="overlay-score">최종 점수 <strong id="final-score">0</strong>점</p>
          <div class="overlay-actions">
            <button class="button" type="button" id="retry-button">다시 하기</button>
          </div>
        </div>
      </div>

      <p class="game-help" id="game-help">방향키 또는 WASD로 타일을 움직이세요. 모바일에서는 판을 스와이프하세요.</p>
      <div class="sr-only" id="announcer" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
