<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // 깜빡임(FOUC) 방지: 저장된 선택 → 시스템 설정 순서로 테마를 정한다.
    (() => {
      let theme = null;
      try {
        theme = localStorage.getItem('theme');
      } catch (error) {
        theme = null;
      }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <meta name="description" content="My Blog 소개">
  <title>소개 - My Blog</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-header__title" href="index.html">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">🌙</button>
      <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="메뉴 열기">☰</button>
      <nav class="nav" id="site-nav" aria-label="주 메뉴">
        <ul class="nav__list">
          <li><a class="nav__link" href="index.html">글 목록</a></li>
          <li><a class="nav__link nav__link--active" href="about.html" aria-current="page">소개</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main">
    <article class="container about">
      <h1 class="page-title">소개</h1>
      <p class="about__lead">안녕하세요. 웹을 처음부터 하나씩 직접 만들어 보며 배우는 중입니다.</p>

      <section class="about__section" aria-labelledby="about-blog">
        <h2 class="about__heading" id="about-blog">이 블로그는</h2>
        <p>프레임워크나 라이브러리 없이 순수 HTML, CSS, JavaScript만으로 만들었습니다. 다크 모드와 모바일 화면을 지원합니다.</p>
      </section>

      <section class="about__section" aria-labelledby="about-plan">
        <h2 class="about__heading" id="about-plan">앞으로 할 일</h2>
        <ol class="about__list">
          <li>블로그에 글 쓰기</li>
          <li>작은 웹앱 만들어 붙이기</li>
          <li>GitHub Pages로 배포하기</li>
          <li>계획·구현·검토·연결 순서로 작업하는 방식 익히기</li>
        </ol>
      </section>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 My Blog</p>
    </div>
  </footer>
</body>
</html>
